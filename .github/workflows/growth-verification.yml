name: Growth verification and motion proof
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:agents
      - run: pnpm lint:growth
      - run: pnpm exec tsx --test server/*.test.ts api/*.test.ts
      - run: pnpm proof:daily-20-scheduler
      - run: pnpm exec vite build --config vite.vercel.config.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/reels/requirements.txt
      - run: python scripts/reels/render.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbl-growth-no-send-and-motion-proof
          path: outputs/
